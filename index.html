<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #faf4eb;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 15px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .header-text {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 15px;
            pointer-events: none;
        }
        h1 {
            font-size: 1.6rem;
            color: #7a4b1e;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-weight: 700;
        }
        .counter-container {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 30px;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #ffd866;
            width: 88%;
            max-width: 350px;
        }
        .counter-title {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 5px;
        }
        .counter-time {
            font-size: 1.05rem;
            color: #d48806;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Flores Amarillas para ti 🌻</h1>
    </div>

    <canvas id="canvas"></canvas>

    <div class="counter-container">
        <div class="counter-title">Mi amor por ti comenzó hace...</div>
        <div class="counter-time" id="counter">Calculando tiempo...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Generar corazón de flores amarillas tupido
        const heartFlowers = [];
        const numFlowers = 650; // Más flores para tupir los huecos

        function initHeart() {
            heartFlowers.length = 0;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 30;
            const scale = Math.min(canvas.width, canvas.height) / 30;

            for (let i = 0; i < numFlowers; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.pow(Math.random(), 0.5); 
                
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                x *= r * scale;
                y *= r * scale;

                heartFlowers.push({
                    x: centerX + x,
                    y: centerY + y,
                    size: Math.random() * 5.5 + 4.5,
                    color: Math.random() > 0.25 ? '#ffcc00' : '#ff9900',
                    angle: Math.random() * Math.PI * 2
                });
            }
        }
        initHeart();
        window.addEventListener('resize', initHeart);

        // Lluvia de flores cayendo
        const fallingParticles = [];
        for (let i = 0; i < 35; i++) {
            fallingParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 5 + 4,
                speedY: Math.random() * 1.2 + 0.6,
                speedX: Math.random() * 0.8 - 0.4,
                angle: Math.random() * Math.PI * 2
            });
        }

        function drawFlor(x, y, size, color, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // Pétalos suaves
            ctx.fillStyle = color;
            for (let i = 0; i < 5; i++) {
                ctx.rotate((Math.PI * 2) / 5);
                ctx.beginPath();
                ctx.arc(0, size * 0.6, size * 0.45, 0, Math.PI * 2);
                ctx.fill();
            }
            // Centro
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#4a2c11';
            ctx.fill();

            ctx.restore();
        }

        function drawTreeTrunk() {
            const centerX = canvas.width / 2;
            const bottomY = canvas.height / 2 + 190;
            const topY = canvas.height / 2 - 20;

            ctx.save();
            
            // Tronco principal limpio
            ctx.beginPath();
            ctx.fillStyle = '#523013';
            ctx.moveTo(centerX - 14, bottomY);
            ctx.quadraticCurveTo(centerX - 8, bottomY - 110, centerX - 5, topY + 50);
            ctx.lineTo(centerX + 5, topY + 50);
            ctx.quadraticCurveTo(centerX + 8, bottomY - 110, centerX + 14, bottomY);
            ctx.closePath();
            ctx.fill();

            // Ramas elegantes
            ctx.strokeStyle = '#523013';
            ctx.lineCap = 'round';
            
            // Rama izquierda
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX - 2, topY + 80);
            ctx.quadraticCurveTo(centerX - 40, topY + 40, centerX - 90, topY + 20);
            ctx.stroke();

            // Rama derecha
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX + 2, topY + 70);
            ctx.quadraticCurveTo(centerX + 40, topY + 30, centerX + 90, topY + 15);
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar Copa de Flores (AL FONDO)
            heartFlowers.forEach(f => {
                drawFlor(f.x, f.y, f.size, f.color, f.angle);
            });

            // 2. Dibujar Tronco y Ramas (POR ENCIMA DE LAS FLORES)
            drawTreeTrunk();

            // 3. Dibujar flores cayendo en frente
            fallingParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += 0.02;

                if (p.y > canvas.height + 10) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }

                drawFlor(p.x, p.y, p.size, '#ffcc00', p.angle);
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Contador de tiempo
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `<b>${days}</b> días <b>${hours}</b>h <b>${minutes}</b>m <b>${seconds}</b>s`;
        }
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
