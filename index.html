<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas Para Ti 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0c0c0f;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }
        h1 {
            font-size: 1.8rem;
            color: #ffe600;
            text-shadow: 0 0 10px #ffbb00, 0 0 20px #ff9900;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .counter {
            font-size: 1rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 230, 0, 0.3);
            text-shadow: 0 0 5px #ffcc00;
            margin-top: 15px;
        }
        .tree-container {
            position: relative;
            width: 200px;
            height: 220px;
            margin: 0 auto 10px auto;
        }
        /* Tronco y ramas simuladas con CSS/Canvas */
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="content">
        <h1>Flores Amarillas para el amor de mi vida</h1>
        <div class="counter" id="counter">Calculando tiempo...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Partículas (Flores amarillas y corazones cayendo)
        const particles = [];
        
        class Particle {
            constructor(x, y, isHeartShape = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.angle = Math.random() * Math.PI;
                this.spin = (Math.random() - 0.5) * 0.03;
                this.opacity = Math.random() * 0.5 + 0.5;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;

                // Dibujar flor amarilla estilo pétalos
                ctx.beginPath();
                ctx.fillStyle = '#ffcc00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffaa00';
                for (let i = 0; i < 5; i++) {
                    ctx.rotate((Math.PI * 2) / 5);
                    ctx.beginPath();
                    ctx.arc(0, this.size * 0.6, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Centro de la flor
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#663300';
                ctx.fill();

                ctx.restore();
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.5;
                this.angle += this.spin;

                if (this.y > canvas.height + 20) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        // Crear lluvia inicial de flores
        for (let i = 0; i < 40; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar tronco estático del árbol en el centro inferior
            drawTreeTrunk();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        function drawTreeTrunk() {
            const centerX = canvas.width / 2;
            const bottomY = canvas.height / 2 + 100;

            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = '#4a2511';
            // Tronco
            ctx.moveTo(centerX - 12, bottomY);
            ctx.lineTo(centerX - 6, bottomY - 140);
            ctx.lineTo(centerX + 6, bottomY - 140);
            ctx.lineTo(centerX + 12, bottomY);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        animate();

        // Contador de tiempo (Cambia la fecha aquí abajo por la tuya)
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `Mi amor comenzó hace: <br><b>${days}</b> días <b>${hours}</b>h <b>${minutes}</b>m <b>${seconds}</b>s`;
        }
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
