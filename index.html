<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #faf5ee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            padding: 20px 10px;
        }
        .header-text {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }
        h1 {
            font-size: 1.3rem;
            color: #5c3a21;
            font-weight: bold;
        }
        
        /* Contenedor principal del Árbol */
        .tree-container {
            position: relative;
            width: 300px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Copa de Corazón Estética */
        .heart-crown {
            position: absolute;
            top: 20px;
            width: 260px;
            height: 220px;
            z-index: 1;
        }

        /* Tronco Elegante dibujado con CSS */
        .trunk-base {
            width: 18px;
            height: 140px;
            background: linear-gradient(180deg, #523013, #3a200a);
            border-radius: 8px 8px 0 0;
            position: relative;
            z-index: 2;
        }
        /* Ramas curvas */
        .trunk-base::before {
            content: "";
            position: absolute;
            top: 20px;
            left: -40px;
            width: 50px;
            height: 40px;
            border-top: 8px solid #523013;
            border-radius: 40px 0 0 0;
        }
        .trunk-base::after {
            content: "";
            position: absolute;
            top: 10px;
            right: -40px;
            width: 50px;
            height: 40px;
            border-top: 8px solid #523013;
            border-radius: 0 40px 0 0;
        }

        /* Flor individual dentro del corazón */
        .flower-item {
            position: absolute;
            font-size: 18px;
            user-select: none;
            animation: pop 0.5s ease-out forwards;
        }

        /* Tarjeta del Contador */
        .counter-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            border: 1px solid #ffe066;
            width: 90%;
            max-width: 330px;
            margin-bottom: 20px;
            z-index: 10;
        }
        .counter-title {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 4px;
        }
        .counter-time {
            font-size: 1rem;
            color: #d48806;
            font-weight: bold;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Flores Amarillas para ti 🌻</h1>
    </div>

    <div class="tree-container">
        <div class="heart-crown" id="heartCanopy"></div>
        <div class="trunk-base"></div>
    </div>

    <div class="counter-card">
        <div class="counter-title">Mi amor por ti comenzó hace...</div>
        <div class="counter-time" id="counter">Calculando...</div>
    </div>

    <script>
        // Rellenar la copa en forma de corazón con flores perfectamente distribuidas
        const canopy = document.getElementById('heartCanopy');
        const totalFlowers = 180;

        for (let i = 0; i < totalFlowers; i++) {
            const t = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()); 

            // Ecuación limpia de corazón
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            // Mapeo a píxeles
            const posX = 130 + (x * r * 7);
            const posY = 100 + (y * r * 7);

            const flower = document.createElement('span');
            flower.className = 'flower-item';
            flower.innerHTML = '🌻';
            flower.style.left = `${posX}px`;
            flower.style.top = `${posY}px`;
            flower.style.animationDelay = `${Math.random() * 1.5}s`;

            canopy.appendChild(flower);
        }

        // Contador de tiempo exacto
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `<b>${days}</b> días <b>${hours}</b>h <b>${minutes}</b>m <b>${seconds}</b>s`;
        }
        
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
