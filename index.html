<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #faf5ee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            padding: 20px 10px;
        }
        .header-text {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }
        h1 {
            font-size: 1.4rem;
            color: #5c3a21;
            font-weight: bold;
        }
        
        /* Contenedor SVG */
        .svg-container {
            width: 100%;
            max-width: 360px;
            height: 55vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Tarjeta del Contador */
        .counter-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            border: 1px solid #ffe066;
            width: 90%;
            max-width: 330px;
            margin-bottom: 20px;
            z-index: 10;
        }
        .counter-title {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 4px;
        }
        .counter-time {
            font-size: 1rem;
            color: #d48806;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Flores Amarillas para ti 🌻</h1>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 400 450" width="100%" height="100%">
            <!-- Defs para Flores -->
            <defs>
                <g id="flower">
                    <circle cx="0" cy="0" r="1.5" fill="#5c2c06" />
                    <!-- Pétalos -->
                    <circle cx="0" cy="-4" r="2" fill="#ffcc00" />
                    <circle cx="2.8" cy="-2.8" r="2" fill="#ffbb00" />
                    <circle cx="4" cy="0" r="2" fill="#ffcc00" />
                    <circle cx="2.8" cy="2.8" r="2" fill="#ffbb00" />
                    <circle cx="0" cy="4" r="2" fill="#ffcc00" />
                    <circle cx="-2.8" cy="2.8" r="2" fill="#ffbb00" />
                    <circle cx="-4" cy="0" r="2" fill="#ffcc00" />
                    <circle cx="-2.8" cy="-2.8" r="2" fill="#ffbb00" />
                    <!-- Centro -->
                    <circle cx="0" cy="0" r="2.2" fill="#421d03" />
                </g>
            </defs>

            <!-- TRONCO Y RAMAS REALISTAS -->
            <g id="tree-skeleton">
                <!-- Base e Tronco principal -->
                <path d="M 190 430 Q 195 350 192 280 C 190 230 185 200 180 170" stroke="#4a2e18" stroke-width="16" fill="none" stroke-linecap="round"/>
                <path d="M 210 430 Q 205 350 208 280 C 210 230 215 200 220 170" stroke="#3b2311" stroke-width="14" fill="none" stroke-linecap="round"/>
                <path d="M 192 430 L 208 430 L 205 270 L 195 270 Z" fill="#4a2e18" />

                <!-- Ramas Principales -->
                <!-- Rama Izquierda Inferior -->
                <path d="M 196 310 Q 150 290 110 260" stroke="#4a2e18" stroke-width="9" fill="none" stroke-linecap="round"/>
                <path d="M 130 273 Q 100 240 80 210" stroke="#4a2e18" stroke-width="6" fill="none" stroke-linecap="round"/>
                
                <!-- Rama Derecha Inferior -->
                <path d="M 204 300 Q 250 280 290 250" stroke="#3b2311" stroke-width="9" fill="none" stroke-linecap="round"/>
                <path d="M 270 260 Q 300 230 320 190" stroke="#3b2311" stroke-width="6" fill="none" stroke-linecap="round"/>

                <!-- Ramas Centrales Superiores -->
                <path d="M 195 240 Q 160 190 130 140" stroke="#4a2e18" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M 205 240 Q 240 190 270 140" stroke="#3b2311" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M 200 200 Q 200 150 200 110" stroke="#4a2e18" stroke-width="5" fill="none" stroke-linecap="round"/>
            </g>

            <!-- COPA DE FLORES EN FORMA DE CORAZÓN TUPIDO -->
            <g id="flower-canopy"></g>
        </svg>
    </div>

    <div class="counter-card">
        <div class="counter-title">Mi amor por ti comenzó hace...</div>
        <div class="counter-time" id="counter">Calculando...</div>
    </div>

    <script>
        // Generar las flores dentro de la ecuación paramétrica de un corazón
        const canopy = document.getElementById('flower-canopy');
        const numFlowers = 420;

        for (let i = 0; i < numFlowers; i++) {
            const t = Math.random() * Math.PI * 2;
            // Distribución interior uniforme
            const r = Math.sqrt(Math.random()); 

            // Corazón matemático
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            // Escala y posición en el SVG (Centro x:200, y:170)
            const scale = 8.5;
            const finalX = 200 + (x * r * scale);
            const finalY = 170 + (y * r * scale);

            const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            use.setAttribute('href', '#flower');
            use.setAttribute('x', finalX);
            use.setAttribute('y', finalY);

            // Variación de tamaño y rotación aleatoria para naturalidad
            const size = (Math.random() * 0.6 + 0.8).toFixed(2);
            const rot = Math.floor(Math.random() * 360);
            use.setAttribute('transform', `rotate(${rot}, ${finalX}, ${finalY}) scale(${size})`);

            canopy.appendChild(use);
        }

        // Lógica del Contador
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `<b>${days}</b> días <b>${hours}</b>h <b>${minutes}</b>m <b>${seconds}</b>s`;
        }
        
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
