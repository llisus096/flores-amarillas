<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fdf6ec;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 10px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .header-text {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 10px;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            color: #8b5a2b;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        .counter-container {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 25px;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #ffe066;
        }
        .counter-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }
        .counter-time {
            font-size: 1rem;
            color: #d48806;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Flores Amarillas para ti 🌻</h1>
    </div>

    <canvas id="canvas"></canvas>

    <div class="counter-container">
        <div class="counter-title">Mi amor por ti comenzó hace...</div>
        <div class="counter-time" id="counter">Calculando tiempo...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Generar puntos para la copa en forma de corazón
        const heartFlowers = [];
        const numFlowers = 450;

        function initHeart() {
            heartFlowers.length = 0;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;
            const scale = Math.min(canvas.width, canvas.height) / 32;

            for (let i = 0; i < numFlowers; i++) {
                // Ecuación paramétrica de corazón
                const t = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()); // Distribución interna uniforme
                
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                x *= r * scale;
                y *= r * scale;

                heartFlowers.push({
                    x: centerX + x,
                    y: centerY + y,
                    size: Math.random() * 6 + 5,
                    color: Math.random() > 0.2 ? '#ffcc00' : '#ffa500',
                    angle: Math.random() * Math.PI * 2
                });
            }
        }
        initHeart();
        window.addEventListener('resize', initHeart);

        // Hojas/Flores cayendo
        const fallingParticles = [];
        for (let i = 0; i < 30; i++) {
            fallingParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 5 + 4,
                speedY: Math.random() * 1 + 0.5,
                speedX: Math.random() * 0.8 - 0.4,
                angle: Math.random() * Math.PI * 2
            });
        }

        function drawFlor(x, y, size, color, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // Pétalos
            ctx.fillStyle = color;
            for (let i = 0; i < 5; i++) {
                ctx.rotate((Math.PI * 2) / 5);
                ctx.beginPath();
                ctx.arc(0, size * 0.6, size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
            // Centro
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#5c3a21';
            ctx.fill();

            ctx.restore();
        }

        function drawTree() {
            const centerX = canvas.width / 2;
            const bottomY = canvas.height / 2 + 180;
            const topY = canvas.height / 2 - 20;

            // Tronco principal
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = '#5c3a21';
            ctx.moveTo(centerX - 18, bottomY);
            ctx.quadraticCurveTo(centerX - 10, bottomY - 100, centerX - 6, topY + 40);
            ctx.lineTo(centerX + 6, topY + 40);
            ctx.quadraticCurveTo(centerX + 10, bottomY - 100, centerX + 18, bottomY);
            ctx.closePath();
            ctx.fill();

            // Ramas extendidas
            ctx.strokeStyle = '#5c3a21';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX, topY + 80);
            ctx.quadraticCurveTo(centerX - 40, topY + 30, centerX - 80, topY + 10);
            ctx.moveTo(centerX, topY + 70);
            ctx.quadraticCurveTo(centerX + 40, topY + 20, centerX + 80, topY);
            ctx.stroke();
            ctx.restore();

            // Copa de Flores en forma de corazón
            heartFlowers.forEach(f => {
                drawFlor(f.x, f.y, f.size, f.color, f.angle);
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawTree();

            // Animar caída de flores
            fallingParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += 0.02;

                if (p.y > canvas.height + 10) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }

                drawFlor(p.x, p.y, p.size, '#ffcc00', p.angle);
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Contador de tiempo (Ajusta tu fecha aquí)
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `<b>${days}</b> días <b>${hours}</b>h <b>${minutes}</b>m <b>${seconds}</b>s`;
        }
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
