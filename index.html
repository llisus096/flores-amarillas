<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #faf5ee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            padding: 25px 15px;
        }
        .header-text {
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 1.3rem;
            color: #5c4033;
            font-weight: 600;
        }
        /* Contenedor del Árbol estilo Vectorial Limpio */
        .tree-wrapper {
            position: relative;
            width: 280px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Copa de Corazón hecha con Girasoles simulados limpios */
        .heart-crown {
            position: absolute;
            top: 0;
            width: 240px;
            height: 220px;
            background: radial-gradient(circle, #ffcc00 20%, #ff9900 70%);
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* Tronco limpio y elegante */
        .trunk {
            position: absolute;
            bottom: 0;
            width: 16px;
            height: 110px;
            background: linear-gradient(90deg, #5c3a21, #8b5a2b);
            border-radius: 4px;
            z-index: 2;
        }
        /* Tarjeta del Contador */
        .counter-card {
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #ffe680;
            z-index: 10;
            width: 90%;
            max-width: 320px;
        }
        .counter-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
        }
        .counter-time {
            font-size: 0.95rem;
            color: #d48806;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Flores Amarillas para el amor de mi vida</h1>
    </div>

    <div class="tree-wrapper">
        <div class="heart-crown" id="flowerHeart"></div>
        <div class="trunk"></div>
    </div>

    <div class="counter-card">
        <div class="counter-title">Mi amor por ti comenzó hace...</div>
        <div class="counter-time" id="counter">Calculando...</div>
    </div>

    <script>
        // Generar pequeñas flores internas estéticas en la copa
        const heartContainer = document.getElementById('flowerHeart');
        for (let i = 0; i < 35; i++) {
            const span = document.createElement('span');
            span.innerHTML = '🌻';
            span.style.position = 'absolute';
            span.style.fontSize = (Math.random() * 12 + 14) + 'px';
            span.style.left = (Math.random() * 80 + 10) + '%';
            span.style.top = (Math.random() * 80 + 10) + '%';
            span.style.transform = `rotate(${Math.random() * 360}deg)`;
            heartContainer.appendChild(span);
        }

        // Lógica del Contador Exacto en Vivo (JavaScript puro)
        // Puedes cambiar esta fecha cuando quieras por el día en que empezaron
        const startDate = new Date("2025-01-01T00:00:00"); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("counter").innerHTML = 
                `${days} días ${hours}h ${minutes}m ${seconds}s`;
        }
        
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
